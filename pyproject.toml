[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docomotive"
version = "0.1.0"
description = "Local-first PDF-to-EPUB research pipeline"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
    "pymupdf==1.28.2",
    "pillow==10.4.0",
    "lxml==6.1.3",
    "wordfreq==3.1.1",
    "scipy==1.17.1",
    "rapidocr==3.9.2",
    "onnxruntime==1.30.0",
    "symspellpy==6.10.0",
    "spylls==0.1.7",
    "requests==2.34.2",
]

[project.optional-dependencies]
visual = ["weasyprint==70.0"]
research = ["pdf-craft==0.2.1"]
# Optional scoring adapter; requires a separately supplied language model.
# This package has not been installed or validated in the current environment.
kenlm = ["kenlm"]

# This checkout is run through scripts/; installing it supplies dependencies.
[tool.setuptools]
packages = []

# Tesseract, OCRmyPDF, Java/EPUBCheck and Swift/Apple Vision are external tools.
# Transitive research-environment pins remain in requirements-research.lock.txt.
[dependency-groups]
dev = ["black==26.5.1"]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = '''
/(work|output)/
'''
